<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUMAN INDEX — Digital Business Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --charcoal:#111214; --graphite:#303238; --silver:#C0C0C0; --offwhite:#F4F4F2;
  --line:rgba(192,192,192,.18); --line-strong:rgba(192,192,192,.38);
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --pad:clamp(20px,5vw,72px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--charcoal);color:var(--offwhite);font-family:var(--sans);font-weight:300;line-height:1.65;min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:1px solid var(--silver);outline-offset:4px}
.view{display:none;opacity:0;transition:opacity .45s ease}
.view.active{display:block}
.view.show{opacity:1}

/* ---------- Board ---------- */
.board{padding:clamp(40px,8vw,96px) var(--pad) 64px;max-width:1500px;margin:0 auto}
.board-head{text-align:center;margin-bottom:clamp(40px,7vw,80px)}
.label{font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;color:var(--silver)}
.brand{font-family:var(--serif);font-weight:500;font-size:clamp(2.4rem,8vw,5.6rem);letter-spacing:.14em;line-height:1.1;margin:18px 0 16px}
.tagline{font-family:var(--serif);font-style:italic;color:var(--silver);font-size:clamp(1rem,2.4vw,1.3rem)}
.grid{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:var(--pad);margin:0 calc(-1 * var(--pad));padding:6px var(--pad) 14px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
.grid .card{flex:0 0 min(68vw,300px);width:auto;scroll-snap-align:start}
.swipe{margin-top:14px;text-align:center;font-size:.78rem;letter-spacing:.2em;color:var(--silver)}
@media(min-width:1100px){.grid{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:20px;overflow:visible;margin:0;padding:0}.grid .card{flex:none}.swipe{display:none}}
.card{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--graphite);transition:border-color .35s,transform .35s}
.card .frame{position:relative;aspect-ratio:3/4;overflow:hidden;background:#1b1c1f}
.card .frame img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05);transition:transform .7s ease,filter .5s}
.card .info{padding:16px 16px 18px;background:var(--charcoal);border-top:1px solid var(--line)}
.card h2{font-family:var(--serif);font-weight:500;font-size:1.05rem;line-height:1.3;margin-bottom:6px}
.card .meta{font-size:.78rem;color:var(--silver);line-height:1.5}
.card .go{display:inline-block;margin-top:14px;font-size:.66rem;letter-spacing:.26em;color:var(--offwhite);border-bottom:1px solid var(--line-strong);padding-bottom:3px;transition:border-color .3s}
@media(hover:hover){
  .card:hover{border-color:var(--silver);transform:translateY(-4px)}
  .card:hover .frame img{transform:scale(1.04);filter:grayscale(.2)}
  .card:hover .go{border-color:var(--offwhite)}
}
.fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:clamp(2.6rem,7vw,4.5rem);color:var(--silver);letter-spacing:.08em;background:linear-gradient(0deg,#1b1c1f,#25272b)}

/* ---------- Profile ---------- */
.topbar{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:14px var(--pad);background:rgba(17,18,20,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.btn{font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;padding:11px 16px;border:1px solid var(--line-strong);transition:background .3s,color .3s,border-color .3s;white-space:nowrap}
.btn:hover{background:var(--offwhite);color:var(--charcoal);border-color:var(--offwhite)}
.pager{display:flex;gap:8px}
.btn:disabled{opacity:.3;cursor:default;pointer-events:none}
.count{align-self:center;font-size:.78rem;letter-spacing:.2em;color:var(--silver);padding:0 6px;white-space:nowrap}
.track{--pw:min(1000px,86vw);position:relative;display:flex;align-items:flex-start;gap:clamp(14px,2vw,24px);padding:clamp(20px,4vw,48px) calc((100% - var(--pw)) / 2);overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;transition:height .35s ease}
.track::-webkit-scrollbar{display:none}
.panel{flex:0 0 var(--pw);min-width:0;scroll-snap-align:center;scroll-snap-stop:always;border:1px solid var(--line);background:#16171a;opacity:.3;transition:opacity .4s,border-color .4s;cursor:pointer}
.panel.is-active{opacity:1;border-color:var(--line-strong);cursor:auto}
.panel:not(.is-active) *{pointer-events:none}
.dots{display:flex;justify-content:center;gap:10px;padding:0 0 8px}
.dot{width:34px;height:2px;background:var(--line-strong);transition:background .3s;padding:10px 0;background-clip:content-box}
.dot.on{background:var(--offwhite);background-clip:content-box}
.profile{padding:clamp(22px,4vw,52px);display:grid;gap:clamp(28px,4vw,52px)}
@media(min-width:760px){.profile{grid-template-columns:minmax(220px,320px) 1fr;align-items:start}}
.portrait{aspect-ratio:3/4;overflow:hidden;border:1px solid var(--line);background:#1b1c1f}
.portrait img{width:100%;height:100%;object-fit:cover}
.identity h1{font-family:var(--serif);font-weight:500;font-size:clamp(1.8rem,4.5vw,2.6rem);line-height:1.2;margin:24px 0 10px}
.facts{color:var(--silver);font-size:.92rem}
.facts span{display:block}
.section{padding:28px 0;border-top:1px solid var(--line)}
.section:first-child{border-top:0;padding-top:0}
.section h3{font-family:var(--serif);font-weight:500;font-size:1.35rem;margin-bottom:14px}
.section p{max-width:62ch;color:#dcdcd8}
.edu{display:grid;gap:4px;color:#dcdcd8}
.edu strong{font-weight:500;color:var(--offwhite);font-size:1.05rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none}
.chips li{font-size:.82rem;padding:7px 14px;border:1px solid var(--line-strong);color:var(--offwhite);border-radius:999px}
.socials{display:flex;flex-wrap:wrap;gap:10px}
.social{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border:1px solid var(--line-strong);font-size:.85rem;transition:background .3s,color .3s}
.social svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
a.social:hover{background:var(--offwhite);color:var(--charcoal)}
.social.off{opacity:.35;cursor:default}
.empty{color:var(--silver);font-size:.9rem}
footer{text-align:center;padding:32px var(--pad) 48px;color:var(--silver);font-size:.75rem;letter-spacing:.2em;border-top:1px solid var(--line);margin-top:24px}
@media(max-width:480px){.btn{padding:10px 12px;font-size:.68rem;letter-spacing:.14em}.count{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* =========================================================

   ========================================================= */
:root{
  --charcoal:#f4f3ef;

  --silver:#777872;

html{background:#f4f3ef}
body{
  background:
    radial-gradient(ellipse at 85% 5%,rgba(212,220,206,.42),transparent 34rem),

}

.board{max-width:1440px;padding-top:clamp(58px,10vw,132px);padding-bottom:90px}
.board-head{text-align:left;max-width:940px;margin:0 auto clamp(42px,7vw,86px)}
.label{font-size:.67rem;letter-spacing:.24em;color:#777d70;font-weight:600}

.grid{gap:18px;padding-bottom:22px}
.grid .card{flex:0 0 min(78vw,330px)}

}

@media(hover:hover){
 .card:hover{transform:translateY(-7px);border-color:rgba(23,25,22,.16);box-shadow:0 22px 55px rgba(28,32,24,.11)}
 .card:hover .frame img{transform:scale(1.045);filter:none}

}
.fallback{background:linear-gradient(145deg,#e7e9e1,#d8ddd2);color:#727d6d}
.swipe{font-size:.68rem;letter-spacing:.12em;color:#85877f}
.topbar{

  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);padding-top:14px;padding-bottom:14px
}
.btn{
  border:1px solid var(--line-strong);border-radius:999px;padding:10px 17px;
  color:#343a31;font-size:.67rem;font-weight:600;letter-spacing:.1em;
  transition:background .25s,color .25s,transform .25s
}
.btn:hover{background:#20251f;color:#fff;border-color:#20251f;transform:translateY(-1px)}
.btn:disabled{opacity:.28}
.count{color:#777872;font-size:.72rem}
.track{--pw:min(1080px,90vw);gap:18px;padding-top:clamp(20px,4vw,42px)}
.panel{
  border:1px solid rgba(23,25,22,.09);border-radius:26px;overflow:hidden;
  background:#fff;box-shadow:0 12px 42px rgba(28,32,24,.055);
  opacity:.42;transition:opacity .4s,border-color .4s,box-shadow .4s
}
.panel.is-active{border-color:rgba(23,25,22,.16);box-shadow:0 20px 60px rgba(28,32,24,.09)}
.profile{padding:clamp(22px,4.5vw,58px);gap:clamp(30px,5vw,64px)}
@media(min-width:760px){.profile{grid-template-columns:minmax(230px,330px) 1fr;gap:clamp(34px,5vw,68px)}}
.portrait{border:0;border-radius:18px;background:#e7e7e1;box-shadow:0 12px 28px rgba(20,25,18,.08)}
.portrait img{object-position:center;display:block}
.identity h1{font-family:var(--sans);font-weight:600;letter-spacing:-.055em;font-size:clamp(2rem,4.5vw,3.25rem);line-height:1.02;margin:24px 0 14px}
.facts{color:#81847b;font-size:.84rem;line-height:1.8}
.section{padding:25px 0;border-top:1px solid rgba(23,25,22,.1)}
.section h3{font-family:var(--sans);font-size:.72rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#7b8474;margin-bottom:13px}
.section p{color:#4e514a;font-size:.94rem;line-height:1.85;max-width:65ch}
.edu{color:#62655d;font-size:.9rem;line-height:1.75}

.chips{gap:8px}

footer{

}
@media(max-width:480px){
 .board{padding-top:58px}
 .brand{font-size:clamp(3rem,15vw,4.5rem)}

}

}

<body>

<main id="board" class="view active show" aria-label="The Board">
  <section class="board">
    <header class="board-head">
      <p class="label">DIGITAL BUSINESS · STUDENT DIRECTORY</p>
      <h1 class="brand">Human<br>Index.</h1>
      <p class="tagline">Four individuals. Distinct perspectives. One shared journey.</p>
    </header>
    <div class="grid" id="grid"></div>
    <p class="swipe">SWIPE TO EXPLORE&nbsp; · &nbsp;GESER UNTUK MENJELAJAH</p>
  </section>
  <footer>HUMAN INDEX&nbsp; · &nbsp;DIGITAL BUSINESS</footer>
</main>

<div id="profileView" class="view" aria-live="polite">
  <nav class="topbar" aria-label="Navigasi profil">
    <button class="btn" id="back" type="button">← All people</button>
    <div class="pager">
      <span class="count" id="count"></span>
      <button class="btn" id="prev" type="button">← Prev</button>
      <button class="btn" id="next" type="button">Next →</button>
    </div>
  </nav>
  <div class="track" id="track" aria-label="Profil mahasiswa. Geser ke samping untuk melihat profil lainnya."></div>
  <div class="dots" id="dots" role="tablist" aria-label="Pilih profil"></div>
  <footer>HUMAN INDEX&nbsp; · &nbsp;DIGITAL BUSINESS</footer>
</div>

<script>
/* Foto yang ditanam langsung di file ini (agar tetap tampil tanpa file gambar terpisah).

  link: '<svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.700 0l3-3a4 4 0 0 0-5.700-5.700l-1 1M14 10a4 4 0 0 0-5.700 0l-3 3a4 4 0 0 0 5.700 5.700l1-1"/></svg>'
};
const LABELS = { instagram: "Instagram", linkedin: "LinkedIn", github: "GitHub", tiktok: "TikTok" };
const label = k => LABELS[k] || k.charAt(0).toUpperCase() + k.slice(1);

function portrait(m, big) {
  const fb = '<div class="fallback" aria-hidden="true">' + esc(initials(m.name)) + '</div>';
  if (!m.photo) return fb;
  return '<img src="' + esc(m.photo) + '" alt="Foto ' + esc(m.name) + '" loading="' + (big ? "eager" : "lazy") + '" data-fb="' + esc(initials(m.name)) + '">';
}

/* Fallback jika gambar gagal dimuat */
document.addEventListener("error", e => {
  const img = e.target;
  if (img.tagName === "IMG" && img.dataset.fb) {
    const d = document.createElement("div");
    d.className = "fallback"; d.setAttribute("aria-hidden", "true"); d.textContent = img.dataset.fb;
    img.replaceWith(d);
  }
}, true);

/* ---------- Render board ---------- */
function renderBoard() {
  $("grid").style.setProperty("--cols", members.length);
  $("grid").innerHTML = members.map((m, i) =>
    '<button class="card" type="button" data-i="' + i + '" aria-label="Lihat profil ' + esc(m.name) + '">' +
      '<div class="frame">' + portrait(m, false) + '</div>' +
      '<div class="info"><h2>' + esc(m.name) + '</h2>' +
        '<p class="meta">' + esc(m.nim) + '<br>' + esc(m.study) + '</p>' +
        '<span class="go">VIEW PROFILE</span></div>' +
    '</button>'
  ).join("");
}

/* ---------- Render profile ---------- */
function list(arr) {
  return arr && arr.length ? '<ul class="chips">' + arr.map(x => '<li>' + esc(x) + '</li>').join("") + '</ul>' : '<p class="empty">Belum diisi.</p>';
}
function panel(m, i) {
  const e = m.education || {};
  const soc = Object.keys(m.socials || {}).map(k => {
    const url = m.socials[k], icon = ICONS[k] || ICONS.link;
    return url
      ? '<a class="social" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + icon + '<span>' + esc(label(k)) + '</span></a>'
      : '<span class="social off" aria-disabled="true" title="Tautan belum diisi">' + icon + '<span>' + esc(label(k)) + '</span></span>';
  }).join("");
  return '<section class="panel" data-i="' + i + '" aria-label="Profil ' + esc(m.name) + '"><div class="profile">' +
    '<header class="identity"><div class="portrait">' + portrait(m, true) + '</div>' +
      '<h1>' + esc(m.name) + '</h1>' +
      '<p class="facts"><span>' + esc(m.nim) + '</span><span>' + esc(m.study) + '</span></p></header>' +
    '<div class="details">' +
      '<section class="section"><h3>About Me</h3><p>' + esc(m.about) + '</p></section>' +
      '<section class="section"><h3>Education</h3><div class="edu"><strong>' + esc(e.university) + '</strong>' +
        '<span>' + esc(e.study || m.study) + '</span><span>' + esc(e.semester || m.semester) + '</span>' +
        (e.other ? '<span>' + esc(e.other) + '</span>' : '') + '</div></section>' +
      '<section class="section"><h3>Skills</h3>' + list(m.skills) + '</section>' +
      '<section class="section"><h3>Interests</h3>' + list(m.interests) + '</section>' +
      '<section class="section"><h3>Social Media</h3><div class="socials">' + soc + '</div></section>' +
    '</div></div></section>';
}
function renderAll() {
  $("track").innerHTML = members.map(panel).join("");
  $("dots").innerHTML = members.map((m, i) => '<button class="dot" type="button" data-i="' + i + '" aria-label="Profil ' + esc(m.name) + '"></button>').join("");
}

/* ---------- Navigation ---------- */
/* Alamat #profile-N hanya tambahan; di preview/iframe yang dibatasi browser bisa menolaknya, jadi diabaikan jika gagal */
function setHash(h) {
  try { history.replaceState(null, "", h || (location.pathname + location.search)); } catch (err) {}
}
let current = -1;
const track = $("track");

function setCurrent(i) {
  current = i;
  document.title = members[i].name + " — HUMAN INDEX";
  $("count").textContent = (i + 1) + " / " + members.length;
  $("prev").disabled = i <= 0;
  $("next").disabled = i >= members.length - 1;
  Array.prototype.forEach.call(track.children, (el, k) => el.classList.toggle("is-active", k === i));
  Array.prototype.forEach.call($("dots").children, (el, k) => el.classList.toggle("on", k === i));
  fitHeight();
  setHash("#profile-" + (i + 1));
}
/* Tinggi area geser mengikuti tinggi profil yang sedang aktif, jadi tidak ada ruang kosong berlebih */
function fitHeight() {
  const el = track.children[current];
  if (!el || !track.clientWidth) return;
  const cs = getComputedStyle(track);
  track.style.height = (el.offsetHeight + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom)) + "px";
}
function scrollToIndex(i, smooth) {
  const p = track.children[i];
  track.style.scrollBehavior = smooth ? "smooth" : "auto";
  track.scrollTo({ left: p.offsetLeft - (track.clientWidth - p.offsetWidth) / 2, top: 0 });
}
function swap(hide, showEl, done) {
  hide.classList.remove("show");
  setTimeout(() => {
    hide.classList.remove("active");
    showEl.classList.add("active");
    if (done) done();
    window.scrollTo({ top: 0, behavior: "auto" });
    requestAnimationFrame(() => requestAnimationFrame(() => showEl.classList.add("show")));
  }, 280);
}
function openProfile(i) {
  i = Math.max(0, Math.min(members.length - 1, i));
  if ($("board").classList.contains("active")) {
    swap($("board"), $("profileView"), () => { scrollToIndex(i, false); setCurrent(i); });
  } else {
    scrollToIndex(i, true); setCurrent(i);
  }
}
function openBoard() {
  if (!$("board").classList.contains("active")) {
    swap($("profileView"), $("board"), () => { document.title = "HUMAN INDEX — Digital Business Portfolio"; });
  }
  setHash("");
  current = -1;
}

/* Perbarui profil aktif saat pengunjung menggeser secara manual */
let st;
track.addEventListener("scroll", () => {
  clearTimeout(st);
  st = setTimeout(() => {
    if (!$("profileView").classList.contains("active") || !track.clientWidth) return;
    const mid = track.scrollLeft + track.clientWidth / 2;
    let i = 0, best = Infinity;
    Array.prototype.forEach.call(track.children, (el, k) => {
      const d = Math.abs(el.offsetLeft + el.offsetWidth / 2 - mid);
      if (d < best) { best = d; i = k; }
    });
    if (i !== current) setCurrent(i);
  }, 80);
}, { passive: true });
window.addEventListener("resize", () => { if (current >= 0) { fitHeight(); scrollToIndex(current, false); } });
window.addEventListener("load", () => { if (current >= 0) fitHeight(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (current >= 0) fitHeight(); });

$("grid").addEventListener("click", ev => {
  const c = ev.target.closest(".card");
  if (c) openProfile(+c.dataset.i);
});
$("dots").addEventListener("click", ev => { const d = ev.target.closest(".dot"); if (d) openProfile(+d.dataset.i); });
track.addEventListener("click", ev => { const p = ev.target.closest(".panel"); if (p && +p.dataset.i !== current) openProfile(+p.dataset.i); });
$("back").addEventListener("click", openBoard);
$("prev").addEventListener("click", () => openProfile(current - 1));
$("next").addEventListener("click", () => openProfile(current + 1));
document.addEventListener("keydown", ev => {
  if (current < 0) return;
  if (ev.key === "ArrowLeft") { ev.preventDefault(); openProfile(current - 1); }
  if (ev.key === "ArrowRight") { ev.preventDefault(); openProfile(current + 1); }
  if (ev.key === "Escape") openBoard();
});

/* ---------- Init ---------- */
renderBoard();
renderAll();
(function initFromHash() {
  const m = /^#profile-(\d+)$/.exec(location.hash);
  if (m && members[+m[1] - 1]) {
    $("board").classList.remove("active", "show");
    $("profileView").classList.add("active", "show");
    scrollToIndex(+m[1] - 1, false);
    setCurrent(+m[1] - 1);
  }
})();
</script>
</body>
</html>
